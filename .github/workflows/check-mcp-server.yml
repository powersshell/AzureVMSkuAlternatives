name: Check MCP Server

# Guards the hosted MCP server -- the only delivery surface with no coverage.
#
# This repo ships three surfaces from one dataset: the web app, the PowerShell
# script, and the MCP server (a Container App). Seven guards run against the
# Functions API, and none of them touch MCP. That matters because MCP is built
# and deployed independently -- deploy-mcp-container.yml only fires on
# 'mcp-server/**' -- so its container can sit at an older commit than the API
# while every existing check stays green. A consumer wired to the MCP endpoint
# would get stale answers with nothing red anywhere.
#
# The failure this is really written against is a silent contract break. MCP is
# consumed by agents, not people: no one eyeballs the output, so a renamed field
# or a dropped tool surfaces as an agent quietly reasoning over missing data.
# Generation-aware scoring (2026-08-17) added recommendationScore, scoreBreakdown
# and migrationReadiness to the API -- this asserts they reached MCP too, and
# keeps asserting it.
#
# scripts/check_mcp_server.py speaks real MCP over the wire via fastmcp.Client,
# so it exercises the protocol surface (tools/list, schemas, result envelopes)
# rather than the HTTP handlers underneath. It re-derives generation and family
# from size names independently, so the guard cannot pass on self-consistent
# wrongness. Its tie-collapse threshold is deliberately kept identical to
# scripts/check_recommendation_quality.py (>=4 distinct scores across the full
# result set, not the top 5) -- a tie among same-family same-generation siblings
# is legitimate, and the two guards must not disagree about that.

on:
  push:
    branches: [main]
    paths:
      - 'mcp-server/**'
      - 'scripts/check_mcp_server.py'
      - '.github/workflows/check-mcp-server.yml'
  # Deliberately no pull_request trigger, matching the other live-surface guards:
  # this asserts against the deployed Container App, which only reflects a change
  # after it merges. On a PR it would report a regression that isn't one.
  #
  # The daily run is the point of this guard, not a formality. MCP has no
  # path-trigger relationship to the API, so an API-only change that alters the
  # shared data contract lands with this workflow never firing. The schedule is
  # what catches that drift.
  schedule:
    - cron: '40 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate hosted MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Unlike the stdlib-only API guards, this one needs a real MCP client --
      # hand-rolling the streamable-HTTP transport would test our imitation of
      # the protocol rather than the protocol.
      - name: Install MCP client
        run: python -m pip install --quiet 'fastmcp>=3,<4'

      - name: Check MCP server
        run: python scripts/check_mcp_server.py --location eastus
