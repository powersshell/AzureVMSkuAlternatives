name: Check Public Region Coverage

on:
  push:
    branches: [main]
    paths:
      - 'web-app/api/**'
      - 'web-app/src/**'
      - 'scripts/*region*'
      - '.github/workflows/check-region-coverage.yml'
  pull_request:
    paths:
      - 'web-app/api/**'
      - 'web-app/src/**'
      - 'scripts/*region*'
      - '.github/workflows/check-region-coverage.yml'
  schedule:
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r web-app/api/requirements-dev.txt
      - run: python -m pytest web-app/api/tests/test_regions.py -m unit -q
      - run: python -m pytest web-app/api/tests/test_unit.py -m unit -k "PublicRegions or TemporaryDisks" -q
      - run: node scripts/test_region_ui.js
      - run: node scripts/test_browse_filters_ui.js
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: python scripts/check_region_coverage.py
